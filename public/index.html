<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<title>Yalla Decide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
/* Datamosh identity: blocky gradient field behind everything, hard edges, chroma-split magenta/cyan, mono type. Single dark theme by design. */
:root{
  --bg:#0d0d12; --panel:rgba(13,13,18,.72); --panel-2:rgba(255,255,255,.05); --line:rgba(255,255,255,.14);
  --fg:#f2f0ff; --muted:#9a94b8; --mag:#ff4fa0; --cyan:#28dcff; --yel:#ffe34d; --grn:#4dffb0; --red:#ff3b5c;
  --pix:"Press Start 2P",monospace; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --ar:"IBM Plex Sans Arabic","IBM Plex Mono",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
[dir="rtl"] body, [dir="rtl"] input, [dir="rtl"] button{font-family:var(--ar)}
#mosh{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated;opacity:.55;filter:saturate(1.1)}
#scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(13,13,18,.9) 100%)}
.app{position:relative;z-index:2;min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--pix);font-size:13px;letter-spacing:.02em;position:relative;color:#fff}
.brand::before,.brand::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none}
.brand::before{color:var(--mag);transform:translate(-2px,0);mix-blend-mode:screen;opacity:.8}
.brand::after{color:var(--cyan);transform:translate(2px,0);mix-blend-mode:screen;opacity:.8}
[dir="rtl"] .brand{font-family:var(--ar);font-weight:700;font-size:18px}
.lang{background:transparent;border:2px solid var(--line);color:var(--fg);padding:6px 10px;font:600 12px var(--mono)}
.lang b{color:var(--yel)}
.cap{font:600 10px var(--pix);color:var(--mag);letter-spacing:.06em;opacity:.8}
[dir="rtl"] .cap{font:700 12px var(--ar)}

h1,h2,h3{margin:0;font-family:var(--pix);line-height:1.2;text-wrap:balance}
h1{font-size:clamp(26px,8vw,38px)}
h2{font-size:clamp(18px,5.6vw,24px)}
h3{font-size:14px}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:var(--ar);font-weight:700}
[dir="rtl"] h1{font-size:clamp(34px,10vw,46px)}
[dir="rtl"] h2{font-size:clamp(24px,7vw,30px)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;pointer-events:none;mix-blend-mode:screen;opacity:.85}
.glitch::before{color:var(--mag);transform:translate(-3px,-1px);clip-path:inset(0 0 55% 0)}
.glitch::after{color:var(--cyan);transform:translate(3px,1px);clip-path:inset(45% 0 0 0)}
@media (prefers-reduced-motion:no-preference){
  .glitch::before{animation:jit 2.6s steps(2) infinite}.glitch::after{animation:jit 3.1s steps(2) infinite reverse}
  @keyframes jit{0%,88%,100%{transform:translate(-3px,-1px)}90%{transform:translate(4px,2px)}94%{transform:translate(-5px,1px)}}
}
.sub{color:var(--muted);margin:6px 0 0;max-width:36ch}

.panel{background:var(--panel);border:2px solid var(--line);backdrop-filter:blur(10px);padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.panel::after{content:"";position:absolute;inset:-2px;pointer-events:none;border:2px solid transparent;
  border-image:linear-gradient(90deg,var(--mag),transparent 30%,transparent 70%,var(--cyan)) 1;opacity:.6}
.lbl{font:600 10px var(--pix);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
[dir="rtl"] .lbl{font:700 12px var(--ar)}
.field{width:100%;background:#000;border:2px solid var(--line);color:var(--fg);padding:13px 14px;font:inherit;font-size:16px}
.field:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(40,220,255,.2)}
.field::placeholder{color:#5e5880}
.row{display:flex;gap:8px;align-items:stretch}
.row>.field{flex:1;min-width:0}
.btn{border:0;background:var(--panel-2);color:var(--fg);padding:14px 16px;font:600 13px var(--pix);text-transform:uppercase;cursor:pointer;position:relative;min-height:50px;
  box-shadow:inset 0 0 0 2px var(--line);transition:transform .06s ease}
[dir="rtl"] .btn{font:700 16px var(--ar)}
.btn:active{transform:translate(2px,2px)}
.btn.pri{background:var(--mag);color:#1a0010;box-shadow:4px 4px 0 var(--cyan)}
.btn.pri:active{box-shadow:1px 1px 0 var(--cyan)}
.btn.cy{background:var(--cyan);color:#001318;box-shadow:4px 4px 0 var(--mag)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;box-shadow:inset 0 0 0 2px var(--line);transform:none}
.btn.ghost{background:transparent}
.err{color:var(--red);font-size:13px;margin:0}

.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sj{background:#000;border:2px solid var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--fg)}
.sj .ic{font-size:24px;line-height:1}.sj .t{font:600 9px var(--pix);text-align:center;line-height:1.3}
[dir="rtl"] .sj .t{font:700 13px var(--ar)}
.sj.on{border-color:var(--yel);box-shadow:4px 4px 0 var(--mag);background:#1a1024}
.seg{display:flex;gap:0;border:2px solid var(--line)}
.seg button{flex:1;background:#000;border:0;color:var(--muted);padding:10px;font:600 12px var(--mono);cursor:pointer}
.seg button.on{background:var(--yel);color:#141000;font-weight:700}

.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{display:flex;align-items:center;gap:8px;background:#000;border:2px solid var(--line);padding:6px 10px 6px 6px;font-weight:600;position:relative}
[dir="rtl"] .pl{padding:6px 6px 6px 10px}
.pl .av{width:28px;height:28px;display:grid;place-items:center;font:700 11px var(--pix);color:#0d0d12;position:relative}
.pl .av::after{content:"";position:absolute;inset:0;box-shadow:2px 0 0 var(--mag),-2px 0 0 var(--cyan);mix-blend-mode:screen;opacity:.7}
.pl.off{opacity:.45}
.pl.lock{border-color:var(--grn)}
.pl .st{font-size:11px;color:var(--muted)}
.pl .k{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px}
.share{display:flex;flex-direction:column;gap:8px}
.code{font:700 26px var(--pix);color:var(--yel);letter-spacing:.12em;text-align:center;padding:12px;border:2px dashed var(--line);background:#000}
.link{font-size:12px;color:var(--muted);word-break:break-all;text-align:center}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.blink{width:10px;height:10px;background:var(--grn);box-shadow:0 0 12px var(--grn)}
@media (prefers-reduced-motion:no-preference){.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.2}}}

.prog{height:8px;background:#000;border:2px solid var(--line)}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--mag) 0 6px,var(--cyan) 6px 12px);width:0;transition:width .25s steps(6)}
.q h2{margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#000;border:2px solid var(--line);color:var(--fg);padding:16px 10px;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;position:relative;overflow:hidden}
.opt .ic{font-size:30px;line-height:1}.opt .t{font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.opt.wide{grid-column:1/-1;flex-direction:row;min-height:64px}
.opt:active{transform:translate(2px,2px)}
.opt.sel{border-color:var(--yel);background:#1a1024;box-shadow:4px 4px 0 var(--mag),-4px -4px 0 var(--cyan)}
.opt.sel::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,79,160,.18),rgba(40,220,255,.18));pointer-events:none}

.rev{display:flex;gap:12px;background:#000;border:2px solid var(--line);padding:12px 14px;border-inline-start:6px solid var(--mag)}
.rev:nth-child(even){border-inline-start-color:var(--cyan)}
.rev .ic{font-size:24px;line-height:1.1}.rev b{display:block;font-weight:700}.rev small{color:var(--muted)}

.pick{background:#000;border:2px solid var(--line);padding:16px;position:relative;overflow:hidden}
.pick.top{border-color:var(--yel);box-shadow:6px 6px 0 var(--mag)}
.pick .rank{position:absolute;top:10px;inset-inline-end:12px;font:700 16px var(--pix);color:var(--yel)}
[dir="rtl"] .pick .rank{font:700 18px var(--ar)}
.pick h3{padding-inline-end:48px;font-size:15px;line-height:1.4}
[dir="rtl"] .pick h3{font-size:19px}
.pick .type{color:var(--cyan);font-size:12px;margin-top:4px;font-weight:600}
.pick p{margin:10px 0 0;color:#d8d4ee}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;padding:4px 8px;border:2px solid var(--line);font-weight:600}
.tag.y{border-color:var(--yel);color:var(--yel)}
.pick.vetoed{opacity:.4}
.pick .stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font:700 22px var(--pix);color:var(--red);border:4px solid var(--red);padding:4px 10px;background:rgba(13,13,18,.85)}
[dir="rtl"] .pick .stamp{font:700 28px var(--ar)}
.veto{margin-top:12px;background:transparent;border:2px solid var(--red);color:var(--red);padding:8px 12px;font:600 11px var(--pix);cursor:pointer}
[dir="rtl"] .veto{font:700 14px var(--ar)}
.roast{display:flex;gap:10px;align-items:flex-start;background:#000;border:2px solid var(--line);padding:10px 12px}
.roast .av{flex:none;width:28px;height:28px;display:grid;place-items:center;font:700 11px var(--pix);color:#0d0d12}
.roast p{margin:0}.roast b{color:var(--yel)}
.badge{display:flex;gap:12px;align-items:center;background:#000;border:2px solid var(--grn);padding:12px 14px;box-shadow:4px 4px 0 var(--grn)}
.badge .ic{font-size:26px}.badge b{display:block}.badge small{color:var(--muted)}
.winner{font:700 15px var(--pix);color:var(--grn);text-align:center;line-height:1.5;padding:14px;border:2px solid var(--grn);background:#000}
[dir="rtl"] .winner{font:700 22px var(--ar)}
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ptr{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--yel);margin-bottom:-8px;z-index:2;position:relative}
.wheel{width:min(280px,78vw);height:min(280px,78vw);transition:transform 4s cubic-bezier(.12,.8,.1,1)}
.wheel canvas{width:100%;height:100%;display:block}
.think{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:40px;text-align:center}
.bar{width:220px;height:14px;border:2px solid var(--line);background:#000;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:repeating-linear-gradient(90deg,var(--mag) 0 8px,var(--cyan) 8px 16px)}
@media (prefers-reduced-motion:no-preference){.bar i{animation:ld 1.1s steps(8) infinite}@keyframes ld{to{transform:translateX(250%)}}}
.note{color:var(--muted);font-size:13px;margin:0}
.foot{margin-top:auto;text-align:center;color:var(--muted);font-size:12px;padding-top:10px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yel);color:#141000;padding:10px 14px;font-weight:700;z-index:30;box-shadow:4px 4px 0 var(--mag)}
</style>
</head>
<body>
<canvas id="mosh" aria-hidden="true"></canvas><div id="scan"></div><div id="vig"></div>
<div class="app">
  <div class="top"><div class="brand" id="brand" data-t="YALLA DECIDE">YALLA DECIDE</div><button class="lang" id="langBtn"><b id="lEn">EN</b> / <b id="lAr" style="color:var(--muted)">عربي</b></button></div>
  <div id="view" style="display:flex;flex-direction:column;gap:16px;flex:1"></div>
</div>
<script src="/game.js"></script>
<script>
/* ---------- datamosh background (from the reference, tuned to sit behind UI) ---------- */
(function(){
  const c=document.getElementById('mosh'),x=c.getContext('2d');let W,H,t=0,raf,cols,rows,cell,vec=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){W=c.width=Math.floor(innerWidth*.5);H=c.height=Math.floor(innerHeight*.5);cell=Math.max(12,Math.min(W,H)/14);cols=Math.ceil(W/cell);rows=Math.ceil(H/cell);vec=[];for(let i=0;i<cols*rows;i++)vec.push({dx:0,dy:0,life:0});}
  addEventListener('resize',size);size();
  function base(q,r){const u=q/cols,v=r/rows;return[Math.floor(70+90*Math.sin(u*3+t*.3)),Math.floor(20+50*Math.sin(v*4+t*.4+1)),Math.floor(110+80*Math.sin((u+v)*2-t*.2))];}
  function draw(){x.fillStyle='#0d0d12';x.fillRect(0,0,W,H);
    for(let r=0;r<rows;r++)for(let q=0;q<cols;q++){const m=vec[r*cols+q];
      if(!reduce&&m.life<=0&&Math.random()<0.012){m.dx=(Math.random()*2-1)*cell*2.2;m.dy=(Math.random()*2-1)*cell*1.2;m.life=8+Math.random()*30;}
      if(m.life>0)m.life--;else{m.dx*=.85;m.dy*=.85;}
      const sq=q+Math.round(m.dx/cell),sr=r+Math.round(m.dy/cell);const col=base((sq+cols)%cols,(sr+rows)%rows);const s=m.life>0?1:0;
      x.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;x.fillRect(q*cell,r*cell,cell+s,cell+s);
      if(m.life>0){x.globalAlpha=.5;x.fillStyle='rgb(255,40,160)';x.fillRect(q*cell+3,r*cell,cell,cell);x.fillStyle='rgb(40,220,255)';x.fillRect(q*cell-3,r*cell,cell,cell);x.globalAlpha=1;}}
    t+=reduce?0:.03;raf=requestAnimationFrame(draw);}
  function play(){cancelAnimationFrame(raf);draw();}
  document.addEventListener('visibilitychange',()=>document.hidden?cancelAnimationFrame(raf):play());
  window.burst=()=>{if(reduce)return;for(const m of vec){m.dx=(Math.random()*2-1)*cell*3;m.dy=(Math.random()*2-1)*cell*2;m.life=20+Math.random()*20;}};
  play();
})();

  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==="joined"){C.code=m.code;C.playerId=m.playerId;C.err=null;try{localStorage.setItem("yd-session",JSON.stringify({code:m.code,playerId:m.playerId}))}catch(e){}history.replaceState(null,"","/r/"+m.code);}

function rAnswer(v){

    b.onclick=()=>{C.answers[q.id]=o.v;g.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");send({type:"answer",answers:C.answers});setTimeout(()=>{if(C.qi<QS.length-1){C.qi++;render();window.scrollTo(0,0)}else render()},200)};g.appendChild(b)});

function revealLines(s){
  const P=s.players.filter(p=>p.answers),L=lang,out=[];
  for(const q of s.pool){const counts={};let n=0;for(const p of P){const v=p.answers[q.id];if(!v)continue;n++;counts[v]=(counts[v]||0)+1}if(!n)continue;
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];const o=q.opts.find(o=>o.v===top[0]);if(!o)continue;
    const unanimous=top[1]===n&&n>1;
    out.push({ic:o.ic,b:`${(q[L]||q.en).q}`,s:`${top[1]}/${n} → ${o[L]||o.en}${unanimous?(L==="ar"?" · بالإجماع":" · unanimous"):""}`});}
  return out.slice(0,12);
}

  v.insertAdjacentHTML("beforeend",`<div><div class="cap">${esc(s.name)}</div>${gl(head,"h2")}${s.aiUsed?"":`<p class="note" style="margin-top:6px">${t("aiOff")}</p>`}<p class="note" style="margin-top:6px">${t("vetoHint")}${myVeto?" · "+t("yourVetoUsed"):""}</p></div>`);
  s.picks.forEach((p,i)=>{const c=el("div","pick"+(i===0&&!p.veto?" top":"")+(p.veto?" vetoed":""));
    const owner=s.players.find(x=>x.id===p.by);c.innerHTML=`<span class="rank">#${i+1}</span><h3>${esc(p.name)}</h3><div class="type">${owner?`<span class="av" style="display:inline-grid;width:18px;height:18px;place-items:center;background:${owner.color};color:#0d0d12;font:700 9px var(--pix);vertical-align:middle;margin-inline-end:6px">${esc(ini(owner.name))}</span>`:""}${esc(t("by",p.byName||""))}${p.place&&p.place.toLowerCase()!==String(p.name).toLowerCase()?` · ${esc(p.place)}`:""}</div><p>${esc(p.why?.[L]||p.why?.en||"")}</p><div class="meta">${p.score!=null?`<span class="tag y">${esc(p.score)}% ${t("fit")}</span>`:""}${p.rating?`<span class="tag">★ ${esc(p.rating)} (${esc(p.reviews||0)})</span>`:""}${p.open===true?`<span class="tag" style="color:var(--grn)">● ${t("open")}</span>`:""}${p.price?`<span class="tag">${esc(p.price)}</span>`:""}${p.maps?`<a class="tag" style="color:var(--cyan);text-decoration:none" href="${esc(p.maps)}" target="_blank" rel="noopener">🗺️ ${t("maps")}</a>`:""}${i===0&&!p.veto?`<span class="tag y">★ ${L==="ar"?"الأفضل للشلة":"best fit"}</span>`:""}</div>${p.veto?`<div class="stamp">${t("vetoed")}</div>`:""}`;
    if(!p.veto&&!myVeto&&live.length>1){const vb=el("button","veto","🚫 "+t("veto"));vb.onclick=()=>send({type:"veto",index:i});c.appendChild(vb)}v.appendChild(c)});
  if(s.winner){v.appendChild(el("div","winner",`🎉 ${t("final")}<br>${esc(s.winner.name)}`));}
  if(live.length>1){
    const w=el("div","wheelwrap");w.innerHTML=`<div class="ptr"></div>`;const wheel=el("div","wheel");const cv=document.createElement("canvas");cv.width=600;cv.height=600;wheel.appendChild(cv);w.appendChild(wheel);
    const x=cv.getContext("2d"),n=live.length,seg=2*Math.PI/n,cols=["#ff4fa0","#28dcff","#ffe34d","#4dffb0"];
    live.forEach((p,i)=>{x.beginPath();x.moveTo(300,300);x.arc(300,300,290,i*seg-Math.PI/2,(i+1)*seg-Math.PI/2);x.closePath();x.fillStyle=cols[i%4];x.fill();x.strokeStyle="#0d0d12";x.lineWidth=6;x.stroke();
      x.save();x.translate(300,300);x.rotate(i*seg+seg/2-Math.PI/2);x.fillStyle="#0d0d12";x.font="700 22px 'IBM Plex Mono', monospace";x.textAlign="right";x.fillText(p.name.length>20?p.name.slice(0,19)+"…":p.name,270,8);x.restore()});
    x.beginPath();x.arc(300,300,30,0,7);x.fillStyle="#0d0d12";x.fill();
    wheel.style.transform=`rotate(${C.spinRot}deg)`;
    if(s.winner&&C.shownWinner!==s.winner.at){const idx=live.findIndex(p=>p.name===s.winner.name);if(idx>=0){const target=360*6+(360-(idx*360/n+360/n/2));C.spinRot=C.spinRot-(C.spinRot%360)+target;requestAnimationFrame(()=>requestAnimationFrame(()=>{wheel.style.transform=`rotate(${C.spinRot}deg)`}));setTimeout(burst,4000);C.shownWinner=s.winner.at}}
    v.appendChild(w);
    if(isHost()){const b=el("button","btn pri block","🎡 "+t("spin"));b.onclick=()=>{b.disabled=true;send({type:"spin"})};v.appendChild(b)}
  }
  const dv=el("div","badge");dv.innerHTML=s.driver?`<span class="ic">🔑</span><div><b>${t("driver")}: ${esc(s.driver)}</b><small>${t("driverSub")}</small></div>`:`<span class="ic">🚕</span><div><b>${t("noDriver")}</b><small>${t("noDriverSub")}</small></div>`;v.appendChild(dv);
  if(s.roasts.length){const rc=el("div","panel");rc.innerHTML=`<div class="lbl">${t("roasts")}</div>`;s.roasts.forEach(r=>{const pl=s.players.find(p=>p.name===r.player);const x=el("div","roast");x.innerHTML=`<span class="av" style="background:${pl?pl.color:"#ff4fa0"}">${esc(ini(r.player||"?"))}</span><p><b>${esc(r.player)}</b> ${esc(r[L]||r.en||"")}</p>`;rc.appendChild(x)});v.appendChild(rc)}
  const bl=el("button","btn block",s.blamed?t("blamed",s.blamed):"🫵 "+t("blame"));bl.onclick=()=>send({type:"blame"});v.appendChild(bl);
  if(isHost()){const ag=el("button","btn ghost block",t("again"));ag.onclick=()=>send({type:"restart"});v.appendChild(ag)}
}
applyLang();render();
</script>
</body>
</html>
